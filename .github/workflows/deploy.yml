name: Deploy Expense Tracker Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/deploy.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------
      # Checkout repository
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # Setup Docker Buildx
      # ----------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ----------------------------------------
      # Login to GitHub Container Registry
      # ----------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: rocklimedev
          password: ${{ secrets.GHCR_TOKEN }}

      # ----------------------------------------
      # Build and push backend image
      # ----------------------------------------
      - name: Build and push backend image
        run: |
          docker build --no-cache \
            --platform linux/amd64 \
            -t ghcr.io/rocklimedev/expense-tracker-backend:latest \
            ./backend

          docker push ghcr.io/rocklimedev/expense-tracker-backend:latest

      # ----------------------------------------
      # Deploy to VPS
      # ----------------------------------------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 66.116.204.81
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          script: |
            set -e

            # ----------------------------------------
            # Go to Expense Tracker project
            # ----------------------------------------
            cd /opt/apps/expense-tracker-api

            # ----------------------------------------
            # Login to GitHub Container Registry
            # ----------------------------------------
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u rocklimedev \
              --password-stdin

            # ----------------------------------------
            # Pull latest backend image
            # ----------------------------------------
            docker compose pull backend

            # ----------------------------------------
            # Recreate backend container
            # ----------------------------------------
            docker compose up -d --force-recreate --wait --wait-timeout 180 backend

            # ----------------------------------------
            # Remove unused Docker images
            # ----------------------------------------
            docker image prune -f

            # ----------------------------------------
            # Show running containers
            # ----------------------------------------
            docker compose ps
