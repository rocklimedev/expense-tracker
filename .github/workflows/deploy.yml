name: Publish and deploy expense tracker

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      publish_only:
        description: Publish image without deploying to VPS
        type: boolean
        default: false

concurrency:
  group: expense-tracker-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    outputs:
      backend: ${{ steps.images.outputs.backend }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" \
            --password-stdin

      - name: Build and publish backend
        id: images
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}-backend"
          metadata="$RUNNER_TEMP/backend-build.json"

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" \
            --metadata-file "$metadata" \
            backend

          digest=$(jq -er '."containerimage.digest"' "$metadata")

          echo "backend=$image@$digest" >> "$GITHUB_OUTPUT"

          echo "Backend image published successfully."
          echo "Image: $image"
          echo "Digest: $digest"

  deploy:
    needs: publish

    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.publish_only != true

    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Deploy to VPS
        env:
          VPS_HOST: 66.116.204.81
          VPS_USER: root
          VPS_PORT: 22

          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.backend }}

        run: |
          set -euo pipefail
          umask 077

          echo "Preparing SSH authentication..."

          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT

          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"

          ssh_options=(
            -p "$VPS_PORT"
            -i "$ssh_dir/key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
          )

          scp_options=(
            -P "$VPS_PORT"
            -i "$ssh_dir/key"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o StrictHostKeyChecking=yes
          )

          target="$VPS_USER@$VPS_HOST"
          APP_DIR="/opt/apps/expense-tracker-api"

          echo "Verifying VPS SSH connection..."

          ssh "${ssh_options[@]}" "$target" \
            "echo 'VPS SSH connection successful.'"

          echo "Uploading Compose configuration..."

          scp "${scp_options[@]}" \
            compose.yaml \
            "$target:$APP_DIR/compose.yaml"

          echo "Pulling backend image and deploying..."

          ssh "${ssh_options[@]}" "$target" \
            "cd '$APP_DIR' && BACKEND_IMAGE='$BACKEND_IMAGE' docker compose pull && BACKEND_IMAGE='$BACKEND_IMAGE' docker compose up -d --wait --wait-timeout 180"

          echo "Verifying deployed containers..."

          ssh "${ssh_options[@]}" "$target" \
            "cd '$APP_DIR' && docker compose ps"

          echo "Expense Tracker deployed successfully."
