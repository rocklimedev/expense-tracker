<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline · Expense Tracker</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: 1rem;
        place-items: center;
        font-family: system-ui, sans-serif;
        color: #0f172a;
        background: #fbfaf8;
      }
      main {
        width: min(100%, 26rem);
        padding: clamp(1.25rem, 5vw, 2rem);
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: white;
      }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: .75rem 0 1.5rem; line-height: 1.5; color: #475569; }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        padding: .5rem 1rem;
        border-radius: .5rem;
        color: white;
        background: #0f766e;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #0f766e; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>Reconnect to the internet to view or update your expenses.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
